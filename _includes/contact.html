<section id="contact">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <h2 class="section-heading">Contact Us</h2>
                    <h3 class="section-subheading text-muted"></h3>
                </div>
            </div>
            <div class="row">
                <div class="col-lg-12">
                   <!--<form name="sentMessage" id="contactForm" novalidate>--> 
                    <form action="https://formsubmit.co/form.phonovoxgroup@gmail.com" method="POST">
                   
                    <input type="hidden" name="_captcha" value="false">
                   
                    <div class="row">
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <!--<input type="text" class="form-control" placeholder="Your Name *" id="name" required data-validation-required-message="Please enter your name.">-->
                                    <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                                    <p class="help-block text-danger"></p>
                                </div>

                                <div class="control-group form-group">
                                    <!--<input type="email" class="form-control" placeholder="Your Email *" id="email" required data-validation-required-message="Please enter your email address.">-->
                                    <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                                    <p class="help-block text-danger"></p>
                                </div>

                                <div class="control-group form-group">
                                    <!--<input type="tel" class="form-control" placeholder="Your Phone (optional)" id="phone" >-->
                                    <input type="tel" name="phone" class="form-control" placeholder="Your Phone (optional)">
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="control-group form-group">
                                    <!--<textarea class="form-control" placeholder="Your Message *" id="message" required data-validation-required-message="Please enter a message."></textarea>-->
                                    <textarea name="message" class="form-control" placeholder="Your Message" required></textarea>
                                    <p class="help-block text-danger"></p>
                                </div>
                            </div>
                            <div class="clearfix"></div>
                            <div class="col-lg-12 text-center">
                                <div id="success"></div>
                                <button type="submit" class="btn btn-xl">Send Message</button>
                            </div>
                        </div>
                        
                    </form>
                </div>
            </div>
        </div>
    </section>
